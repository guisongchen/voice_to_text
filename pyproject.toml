[project]
name = "voice-to-text"
version = "1.0.0"
description = "Voice-to-Text Input Tool"
requires-python = ">=3.10"
dependencies = [
    "qwen-asr",
    "pyaudio>=0.2.14",
    "numpy>=1.24.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.0",
    "evdev>=1.7.0",
]

[project.scripts]
voice-to-text = "voice_to_text.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
