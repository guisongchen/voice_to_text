<div class="card services-card">
    <h2>应用服务</h2>
    <table class="services-table">
        <thead>
            <tr>
                <th>服务</th>
                <th>状态</th>
                <th>运行时长</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for svc in services %}
            <tr>
                <td>{{ svc.name }}</td>
                <td>
                    <span class="badge badge-{{ 'active' if svc.active else 'inactive' }}">
                        {{ svc.status }}
                    </span>
                </td>
                <td>{{ svc.uptime or '-' }}</td>
                <td class="actions">
                    <button hx-post="/api/services/{{ svc.name }}/start"
                            hx-target="#status-panel"
                            hx-swap="outerHTML">启动</button>
                    <button class="danger"
                            hx-post="/api/services/{{ svc.name }}/stop"
                            hx-target="#status-panel"
                            hx-swap="outerHTML">停止</button>
                    <button hx-post="/api/services/{{ svc.name }}/restart"
                            hx-target="#status-panel"
                            hx-swap="outerHTML">重启</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
