<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="10">
    <style>
        :root {
            --bg: #0f1115;
            --card-bg: #181b21;
            --text: #e4e6eb;
            --muted: #9ca3af;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --border: #2d3139;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 0.85rem;
            padding: 0.5rem 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--muted);
            font-weight: 500;
            font-size: 0.78rem;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-active { background: rgba(34,197,94,0.15); color: var(--success); }
        .badge-inactive { background: rgba(156,163,175,0.15); color: var(--muted); }
    </style>
</head>
<body>
    <table>
        <thead><tr><th>服务</th><th>状态</th><th>运行时长</th></tr></thead>
        <tbody>
            {% for svc in services %}
            <tr>
                <td>{{ svc.name }}</td>
                <td><span class="badge badge-{{ 'active' if svc.active else 'inactive' }}">{{ svc.status }}</span></td>
                <td>{{ svc.uptime or '-' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
