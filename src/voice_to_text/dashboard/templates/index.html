{% extends "base.html" %}

{% block content %}

<!-- ASRCore 状态面板 -->
<section id="status-panel" hx-get="/partials/status" hx-trigger="load, every 3s">
    {% include "partials/status.html" %}
</section>

<!-- 日志面板 -->
<section class="logs-section">
    <div class="section-header">
        <h2>服务日志</h2>
        <select id="log-service" name="service"
                hx-get="/partials/logs/asr-core"
                hx-target="#logs-content"
                hx-trigger="change, load"
                hx-vals='js:{lines: 50}'>
            {% for svc in ["asr-core", "asr-core-dashboard", "voice-to-text", "lp998-listener", "voice-to-text-dashboard"] %}
            <option value="{{ svc }}"{% if svc == "asr-core" %} selected{% endif %}>{{ svc }}</option>
            {% endfor %}
        </select>
    </div>
    <div id="logs-content" class="logs-box"
         hx-get="/partials/logs/asr-core"
         hx-target="this"
         hx-trigger="every 3s"
         hx-vals='js:{lines: 50}'>
        {% include "partials/logs.html" %}
    </div>
</section>

<script>
    document.getElementById('log-service').addEventListener('change', function() {
        const logs = document.getElementById('logs-content');
        logs.setAttribute('hx-get', '/partials/logs/' + this.value);
        htmx.process(logs);
        htmx.trigger(logs, 'load');
    });
</script>

{% endblock %}
